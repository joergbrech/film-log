name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check script syntax
        run: for f in app.js store.js sync.js sw.js tests/e2e.js; do node --check "$f"; done
      - name: Check the scan tagger starts
        run: python3 tools/tag_scans.py --help > /dev/null
      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: End-to-end test
        run: npm test
      - name: Keep screenshots when the test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/*.png
